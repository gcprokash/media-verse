name: Media Metadata Scanner

permissions:
  contents: write
  
on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"


jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # INSTALL FFMPEG
      # =========================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # =========================================================
      # INSTALL PYTHON PACKAGES
      # =========================================================

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2


      # =========================================================
      # CREATE METADATA SCANNER
      # =========================================================

      - name: Create Metadata Scanner
        run: |

          cat > scanner.py <<'PYTHON'

          import os
          import re
          import json
          import time
          import shutil
          import hashlib
          import subprocess

          from pathlib import Path

          from google.oauth2 import service_account

          from googleapiclient.discovery import build

          from googleapiclient.http import MediaIoBaseDownload


          # =====================================================
          # CONFIGURATION
          # =====================================================

          VIDEO_FOLDER_ID = "1lu8rV1ctx4nAJ1pRKJguJJS5bUpKGXql"

          SPREADSHEET_ID = "13t2hCpG87CGhOuSdd2yX-6yLnSfufTCR4Jrca_dvg-0"

          SERVICE_ACCOUNT_JSON = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON"
          )

          if not SERVICE_ACCOUNT_JSON:
              raise RuntimeError(
                  "GOOGLE_SERVICE_ACCOUNT_JSON secret পাওয়া যায়নি।"
              )


          # =====================================================
          # GOOGLE AUTH
          # =====================================================

          SCOPES = [
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/spreadsheets"
          ]

          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(SERVICE_ACCOUNT_JSON),
                  scopes=SCOPES
              )
          )

          drive_service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          sheets_service = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          # =====================================================
          # SHEET HEADERS
          # =====================================================

          SHEET_HEADERS = {

              "Media": [
                  "Media_ID",
                  "Title",
                  "File_Name",
                  "Artist",
                  "Album",
                  "Composer",
                  "Genre",
                  "Language",
                  "Resolution",
                  "Video_Codec",
                  "Video_Quality",
                  "Audio_Count",
                  "Hi_Res_Audio",
                  "Subtitle_Count",
                  "Cover",
                  "Cover_Source",
                  "Drive_URL",
                  "Download_URL"
              ],

              "Files": [
                  "File_ID",
                  "Media_ID",
                  "File_Name",
                  "File_Type",
                  "File_Size",
                  "Modified_Time",
                  "Drive_URL",
                  "Download_URL"
              ],

              "Video": [
                  "Video_ID",
                  "Media_ID",
                  "File_Name",
                  "Codec",
                  "Profile",
                  "Width",
                  "Height",
                  "Resolution",
                  "Aspect_Ratio",
                  "FPS",
                  "Bitrate",
                  "Bit_Depth",
                  "Pixel_Format",
                  "HDR",
                  "Scan_Type",
                  "Default"
              ],

              "Audio": [
                  "Audio_ID",
                  "Media_ID",
                  "Track_No",
                  "Title",
                  "Artist",
                  "Codec",
                  "Sample_Rate",
                  "Bit_Depth",
                  "Channels",
                  "Channel_Layout",
                  "Language",
                  "Hi_Res",
                  "Default"
              ],

              "Subtitle": [
                  "Subtitle_ID",
                  "Media_ID",
                  "Track_No",
                  "Codec",
                  "Language",
                  "Title",
                  "Default",
                  "Forced"
              ],

              "Covers": [
                  "Cover_ID",
                  "Media_ID",
                  "File_Name",
                  "Cover_Source",
                  "Cover_URL",
                  "Drive_URL"
              ]
          }


          # =====================================================
          # VIDEO EXTENSIONS
          # =====================================================

          VIDEO_EXTENSIONS = {
              ".mkv",
              ".mp4",
              ".webm",
              ".avi",
              ".mov",
              ".m4v"
          }


          # =====================================================
          # STRING HELPERS
          # =====================================================

          def safe_string(value):

              if value is None:
                  return ""

              return str(value).strip()


          def normalize_text(value):

              value = safe_string(value).lower()

              value = re.sub(
                  r"\.[a-z0-9]{2,5}$",
                  "",
                  value
              )

              value = re.sub(
                  r"\s*\[[^\]]*\]",
                  "",
                  value
              )

              value = re.sub(
                  r"\s*\([^)]*\)",
                  "",
                  value
              )

              value = re.sub(
                  r"[_\-]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          # =====================================================
          # CLEAN TITLE
          # =====================================================

          def clean_title(value):

              name = safe_string(value)

              name = re.sub(
                  r"\.[a-z0-9]{2,5}$",
                  "",
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r"\s*\[[^\]]*\]",
                  "",
                  name
              )

              name = re.sub(
                  r"\s*\([^)]*\)",
                  "",
                  name
              )

              name = re.sub(
                  r"\b("
                  r"4320p|2160p|1440p|1080p|720p|576p|480p|"
                  r"4k|2k|"
                  r"vp9|av1|"
                  r"h\.?264|h\.?265|hevc|"
                  r"multi\s*audio|single\s*audio|"
                  r"multi\s*subtitle|single\s*subtitle|"
                  r"hi[-\s]?res|hires|"
                  r"gcp"
                  r")\b",
                  "",
                  name,
                  flags=re.I
              )

              name = re.sub(
                  r"[_\-]+",
                  " ",
                  name
              )

              name = re.sub(
                  r"\s+",
                  " ",
                  name
              )

              return name.strip(" -_.")


          # =====================================================
          # ARTIST
          # =====================================================

          ARTIST_KEYS = [
              "artist",
              "ARTIST",
              "Artist",
              "artists",
              "ARTISTS",
              "Artists",
              "album_artist",
              "ALBUM_ARTIST",
              "Album Artist",
              "albumartist",
              "ALBUMARTIST",
              "AlbumArtist"
          ]


          def collect_artist_values(tags):

              result = []

              if not isinstance(tags, dict):
                  return result

              for key in ARTIST_KEYS:

                  value = tags.get(key)

                  if value is None:
                      continue

                  if isinstance(value, list):

                      for item in value:

                          item = safe_string(item)

                          if item:
                              result.append(item)

                  else:

                      value = safe_string(value)

                      if value:
                          result.append(value)

              return result


          def split_artist_string(value):

              value = safe_string(value)

              if not value:
                  return []

              parts = re.split(
                  r"\s*[,;/]\s*|\s+\&\s+",
                  value
              )

              return [
                  part.strip()
                  for part in parts
                  if part.strip()
              ]


          def unique_artists(values):

              result = []

              seen = set()

              for value in values:

                  for artist in split_artist_string(value):

                      key = artist.casefold()

                      if key not in seen:

                          seen.add(key)

                          result.append(artist)

              return result


          def get_artist_from_probe(probe):

              artists = []

              # -------------------------------------------------
              # FORMAT TAGS
              # -------------------------------------------------

              format_data = probe.get(
                  "format",
                  {}
              )

              format_tags = format_data.get(
                  "tags",
                  {}
              )

              artists.extend(
                  collect_artist_values(
                      format_tags
                  )
              )

              # -------------------------------------------------
              # STREAM TAGS
              # -------------------------------------------------

              for stream in probe.get(
                  "streams",
                  []
              ):

                  stream_tags = stream.get(
                      "tags",
                      {}
                  )

                  artists.extend(
                      collect_artist_values(
                          stream_tags
                      )
                  )

              artists = unique_artists(
                  artists
              )

              return ", ".join(
                  artists
              )


          # =====================================================
          # FFPROBE
          # =====================================================

          def ffprobe_file(file_path):

              command = [
                  "ffprobe",
                  "-v",
                  "quiet",
                  "-print_format",
                  "json",
                  "-show_format",
                  "-show_streams",
                  str(file_path)
              ]

              result = subprocess.run(
                  command,
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:

                  raise RuntimeError(
                      "FFprobe failed: "
                      + result.stderr
                  )

              return json.loads(
                  result.stdout
              )


          # =====================================================
          # MEDIA ID
          # =====================================================

          def generate_media_id(file_id):

              return hashlib.sha1(
                  file_id.encode("utf-8")
              ).hexdigest()[:16]


          # =====================================================
          # DRIVE URLS
          # =====================================================

          def drive_view_url(file_id):

              return (
                  "https://drive.google.com/file/d/"
                  + file_id
                  + "/view"
              )


          def drive_download_url(file_id):

              return (
                  "https://drive.google.com/uc?"
                  "export=download&id="
                  + file_id
              )


          # =====================================================
          # LIST DRIVE FILES
          # =====================================================

          def list_drive_children(folder_id):

              files = []

              page_token = None

              while True:

                  response = (
                      drive_service
                      .files()
                      .list(
                          q=(
                              f"'{folder_id}' in parents "
                              "and trashed = false"
                          ),
                          fields=(
                              "nextPageToken,"
                              "files("
                              "id,"
                              "name,"
                              "mimeType,"
                              "size,"
                              "modifiedTime"
                              ")"
                          ),
                          pageToken=page_token,
                          pageSize=1000
                      )
                      .execute()
                  )

                  files.extend(
                      response.get(
                          "files",
                          []
                      )
                  )

                  page_token = response.get(
                      "nextPageToken"
                  )

                  if not page_token:
                      break

              return files


          # =====================================================
          # PARENT FOLDER
          # =====================================================

          def find_parent_folder(folder_id):

              response = (
                  drive_service
                  .files()
                  .get(
                      fileId=folder_id,
                      fields="parents"
                  )
                  .execute()
              )

              parents = response.get(
                  "parents",
                  []
              )

              if not parents:
                  return None

              return parents[0]


          # =====================================================
          # COVER FOLDER
          # =====================================================

          def find_cover_folder():

              parent_id = find_parent_folder(
                  VIDEO_FOLDER_ID
              )

              if not parent_id:
                  return None

              children = list_drive_children(
                  parent_id
              )

              for item in children:

                  if (
                      item.get("mimeType")
                      == "application/vnd.google-apps.folder"
                  ):

                      if (
                          item.get("name", "")
                          .strip()
                          .lower()
                          == "cover"
                      ):

                          return item["id"]

              return None


          # =====================================================
          # CUSTOM COVER
          # =====================================================

          def find_custom_cover(
              media_title,
              media_filename,
              cover_files
          ):

              target_title = normalize_text(
                  media_title
              )

              target_filename = normalize_text(
                  media_filename
              )

              # -------------------------------------------------
              # EXACT
              # -------------------------------------------------

              for cover in cover_files:

                  cover_name = normalize_text(
                      cover.get("name", "")
                  )

                  if cover_name == target_title:
                      return cover

                  if cover_name == target_filename:
                      return cover

              # -------------------------------------------------
              # PARTIAL
              # -------------------------------------------------

              for cover in cover_files:

                  cover_name = normalize_text(
                      cover.get("name", "")
                  )

                  if (
                      target_title
                      and target_title in cover_name
                  ):
                      return cover

                  if (
                      target_filename
                      and target_filename in cover_name
                  ):
                      return cover

                  if (
                      cover_name
                      and cover_name in target_title
                  ):
                      return cover

              return None


          # =====================================================
          # EMBEDDED COVER
          # =====================================================

          def extract_embedded_cover(
              video_file,
              media_id
          ):

              covers_dir = Path("covers")

              covers_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              output_file = (
                  covers_dir
                  / f"{media_id}.jpg"
              )

              command = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video_file),
                  "-map",
                  "0:v:m:attached_pic",
                  "-frames:v",
                  "1",
                  "-q:v",
                  "2",
                  str(output_file)
              ]

              result = subprocess.run(
                  command,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )

              if (
                  result.returncode == 0
                  and output_file.exists()
                  and output_file.stat().st_size > 0
              ):

                  return str(output_file)

              return None


          # =====================================================
          # FALLBACK COVER
          # =====================================================

          def create_fallback_cover(
              title,
              media_id
          ):

              covers_dir = Path("covers")

              covers_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              output_file = (
                  covers_dir
                  / f"{media_id}.svg"
              )

              safe_title = (
                  safe_string(title)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )

              svg = f'''<svg
              xmlns="http://www.w3.org/2000/svg"
              width="1200"
              height="1200"
              viewBox="0 0 1200 1200">

              <rect
                  width="1200"
                  height="1200"
                  fill="#111111"/>

              <text
                  x="600"
                  y="600"
                  fill="white"
                  font-size="64"
                  text-anchor="middle"
                  dominant-baseline="middle"
                  font-family="Arial">

                  {safe_title}

              </text>

              </svg>'''

              output_file.write_text(
                  svg,
                  encoding="utf-8"
              )

              return str(output_file)


          # =====================================================
          # VIDEO QUALITY
          # =====================================================

          def video_quality(
              width,
              height
          ):

              try:

                  width = int(width or 0)
                  height = int(height or 0)

              except:

                  return ""

              if (
                  width >= 3840
                  or height >= 2160
              ):
                  return "4K"

              if (
                  width >= 2560
                  or height >= 1440
              ):
                  return "2K"

              if (
                  width >= 1920
                  or height >= 1080
              ):
                  return "1080p"

              if (
                  width >= 1280
                  or height >= 720
              ):
                  return "720p"

              if height:
                  return f"{height}p"

              return ""


          # =====================================================
          # HI-RES
          # =====================================================

          HI_RES_CODECS = {
              "flac",
              "alac",
              "pcm_s16le",
              "pcm_s24le",
              "pcm_s32le",
              "pcm_s16be",
              "pcm_s24be",
              "pcm_s32be",
              "wavpack",
              "ape"
          }


          def detect_hi_res(
              codec,
              sample_rate,
              bit_depth,
              title
          ):

              codec = safe_string(
                  codec
              ).lower()

              title = safe_string(
                  title
              ).lower()

              try:
                  sr = int(
                      sample_rate or 0
                  )
              except:
                  sr = 0

              try:
                  depth = int(
                      bit_depth or 0
                  )
              except:
                  depth = 0

              if codec in HI_RES_CODECS:
                  return True

              if (
                  "hi-res" in title
                  or "hi res" in title
                  or "hires" in title
                  or "high-res" in title
                  or "high res" in title
              ):
                  return True

              if sr >= 96000:
                  return True

              if depth >= 24:
                  return True

              return False


          # =====================================================
          # MANUAL LANGUAGE MAP
          #
          # If the source file does not contain a Language tag,
          # add the original language here using the Title.
          # Example:
          # "VARDAAT": "Haryanvi",
          # =====================================================

          LANGUAGE_MAP = {
              "VARDAAT": "Haryanvi",
          }


          # =====================================================
          # GENERAL METADATA
          # =====================================================

          def get_metadata(
              probe,
              filename
          ):

              format_data = probe.get(
                  "format",
                  {}
              )

              tags = format_data.get(
                  "tags",
                  {}
              )

              # -------------------------------------------------
              # TITLE
              # -------------------------------------------------

              raw_title = (
                  tags.get("title")
                  or tags.get("TITLE")
                  or tags.get("Title")
                  or Path(filename).stem
              )

              title = clean_title(
                  raw_title
              )

              # -------------------------------------------------
              # ARTIST
              # -------------------------------------------------

              artist = get_artist_from_probe(
                  probe
              )

              # -------------------------------------------------
              # ALBUM
              # -------------------------------------------------

              album = (
                  tags.get("album")
                  or tags.get("ALBUM")
                  or tags.get("Album")
                  or ""
              )

              album = safe_string(
                  album
              )

              # -------------------------------------------------
              # COMPOSER
              # -------------------------------------------------

              composer = (
                  tags.get("composer")
                  or tags.get("COMPOSER")
                  or tags.get("Composer")
                  or ""
              )

              composer = safe_string(
                  composer
              )

              # -------------------------------------------------
              # GENRE
              # -------------------------------------------------

              genre = safe_string(
                  tags.get("genre")
                  or tags.get("GENRE")
                  or tags.get("Genre")
              )

              # -------------------------------------------------
              # LANGUAGE
              #
              # Prefer real metadata from the source file.
              # If it is missing, use the manual map above.
              # -------------------------------------------------

              language = safe_string(
                  tags.get("language")
                  or tags.get("LANGUAGE")
                  or tags.get("Language")
              )

              if not language:
                  language = LANGUAGE_MAP.get(
                      title.upper(),
                      ""
                  )

              return {
                  "title": title,
                  "artist": artist,
                  "album": album,
                  "composer": composer,
                  "genre": genre,
                  "language": language
              }


          # =====================================================
          # VIDEO SCAN
          # =====================================================

          def scan_video_streams(
              probe,
              media_id,
              filename
          ):

              rows = []

              video_index = 0

              for stream in probe.get(
                  "streams",
                  []
              ):

                  if stream.get(
                      "codec_type"
                  ) != "video":
                      continue

                  codec = safe_string(
                      stream.get("codec_name")
                  )

                  profile = safe_string(
                      stream.get("profile")
                  )

                  width = stream.get(
                      "width",
                      ""
                  )

                  height = stream.get(
                      "height",
                      ""
                  )

                  resolution = (
                      f"{width}x{height}"
                      if width and height
                      else ""
                  )

                  aspect_ratio = safe_string(
                      stream.get(
                          "display_aspect_ratio"
                      )
                  )

                  fps = ""

                  fps_value = (
                      stream.get(
                          "avg_frame_rate"
                      )
                      or stream.get(
                          "r_frame_rate"
                      )
                  )

                  if (
                      fps_value
                      and fps_value != "0/0"
                  ):

                      try:

                          numerator, denominator = (
                              fps_value.split("/")
                          )

                          if float(denominator) != 0:

                              fps = round(
                                  float(numerator)
                                  / float(denominator),
                                  3
                              )

                      except:
                          fps = ""

                  bitrate = safe_string(
                      stream.get(
                          "bit_rate"
                      )
                  )

                  bit_depth = (
                      stream.get(
                          "bits_per_raw_sample"
                      )
                      or stream.get(
                          "bits_per_sample"
                      )
                      or ""
                  )

                  pixel_format = safe_string(
                      stream.get(
                          "pix_fmt"
                      )
                  )

                  color_transfer = safe_string(
                      stream.get(
                          "color_transfer"
                      )
                  )

                  color_primaries = safe_string(
                      stream.get(
                          "color_primaries"
                      )
                  )

                  hdr = ""

                  if (
                      "smpte2084"
                      in color_transfer.lower()
                  ):

                      hdr = "HDR10"

                  elif (
                      "arib-std-b67"
                      in color_transfer.lower()
                  ):

                      hdr = "HLG"

                  elif (
                      "bt2020"
                      in color_primaries.lower()
                  ):

                      hdr = "BT.2020"

                  field_order = safe_string(
                      stream.get(
                          "field_order"
                      )
                  )

                  if (
                      not field_order
                      or field_order.lower()
                      in {
                          "progressive",
                          "unknown"
                      }
                  ):

                      scan_type = "Progressive"

                  else:

                      scan_type = "Interlaced"

                  default = (
                      "Yes"
                      if stream.get(
                          "disposition",
                          {}
                      ).get(
                          "default",
                          0
                      )
                      else "No"
                  )

                  video_id = (
                      f"{media_id}-V"
                      f"{video_index + 1}"
                  )

                  rows.append({

                      "Video_ID": video_id,

                      "Media_ID": media_id,

                      "File_Name": filename,

                      "Codec": codec,

                      "Profile": profile,

                      "Width": width,

                      "Height": height,

                      "Resolution": resolution,

                      "Aspect_Ratio": aspect_ratio,

                      "FPS": fps,

                      "Bitrate": bitrate,

                      "Bit_Depth": bit_depth,

                      "Pixel_Format": pixel_format,

                      "HDR": hdr,

                      "Scan_Type": scan_type,

                      "Default": default
                  })

                  video_index += 1

              return rows


          # =====================================================
          # AUDIO SCAN
          # =====================================================

          def scan_audio_streams(
              probe,
              media_id
          ):

              rows = []

              audio_index = 0

              for stream in probe.get(
                  "streams",
                  []
              ):

                  if stream.get(
                      "codec_type"
                  ) != "audio":

                      continue

                  tags = stream.get(
                      "tags",
                      {}
                  )

                  title = safe_string(
                      tags.get("title")
                      or tags.get("TITLE")
                      or tags.get("Title")
                      or ""
                  )

                  artist_values = (
                      collect_artist_values(
                          tags
                      )
                  )

                  audio_artist = ", ".join(
                      unique_artists(
                          artist_values
                      )
                  )

                  codec = safe_string(
                      stream.get(
                          "codec_name"
                      )
                  )

                  sample_rate = safe_string(
                      stream.get(
                          "sample_rate"
                      )
                  )

                  bit_depth = (
                      stream.get(
                          "bits_per_raw_sample"
                      )
                      or stream.get(
                          "bits_per_sample"
                      )
                      or ""
                  )

                  channels = stream.get(
                      "channels",
                      ""
                  )

                  channel_layout = safe_string(
                      stream.get(
                          "channel_layout"
                      )
                  )

                  language = safe_string(
                      tags.get("language")
                      or tags.get("LANGUAGE")
                      or tags.get("Language")
                  )

                  hi_res = detect_hi_res(
                      codec,
                      sample_rate,
                      bit_depth,
                      title
                  )

                  default = (
                      "Yes"
                      if stream.get(
                          "disposition",
                          {}
                      ).get(
                          "default",
                          0
                      )
                      else "No"
                  )

                  audio_id = (
                      f"{media_id}-A"
                      f"{audio_index + 1}"
                  )

                  rows.append({

                      "Audio_ID": audio_id,

                      "Media_ID": media_id,

                      "Track_No": audio_index + 1,

                      "Title": title,

                      "Artist": audio_artist,

                      "Codec": codec,

                      "Sample_Rate": sample_rate,

                      "Bit_Depth": bit_depth,

                      "Channels": channels,

                      "Channel_Layout": channel_layout,

                      "Language": language,

                      "Hi_Res": (
                          "Yes"
                          if hi_res
                          else "No"
                      ),

                      "Default": default
                  })

                  audio_index += 1

              return rows


          # =====================================================
          # SUBTITLE SCAN
          # =====================================================

          def scan_subtitle_streams(
              probe,
              media_id
          ):

              rows = []

              subtitle_index = 0

              for stream in probe.get(
                  "streams",
                  []
              ):

                  if stream.get(
                      "codec_type"
                  ) != "subtitle":

                      continue

                  tags = stream.get(
                      "tags",
                      {}
                  )

                  codec = safe_string(
                      stream.get(
                          "codec_name"
                      )
                  )

                  language = safe_string(
                      tags.get("language")
                      or tags.get("LANGUAGE")
                      or tags.get("Language")
                  )

                  title = safe_string(
                      tags.get("title")
                      or tags.get("TITLE")
                      or tags.get("Title")
                  )

                  default = (
                      "Yes"
                      if stream.get(
                          "disposition",
                          {}
                      ).get(
                          "default",
                          0
                      )
                      else "No"
                  )

                  forced = (
                      "Yes"
                      if stream.get(
                          "disposition",
                          {}
                      ).get(
                          "forced",
                          0
                      )
                      else "No"
                  )

                  subtitle_id = (
                      f"{media_id}-S"
                      f"{subtitle_index + 1}"
                  )

                  rows.append({

                      "Subtitle_ID": subtitle_id,

                      "Media_ID": media_id,

                      "Track_No": subtitle_index + 1,

                      "Codec": codec,

                      "Language": language,

                      "Title": title,

                      "Default": default,

                      "Forced": forced
                  })

                  subtitle_index += 1

              return rows


          # =====================================================
          # FILE SIZE
          # =====================================================

          def file_size_text(size):

              if not size:
                  return ""

              try:
                  size = int(size)
              except:
                  return safe_string(size)

              units = [
                  "B",
                  "KB",
                  "MB",
                  "GB",
                  "TB"
              ]

              value = float(size)

              for unit in units:

                  if value < 1024:

                      return (
                          f"{value:.2f} {unit}"
                      )

                  value /= 1024

              return (
                  f"{value:.2f} PB"
              )


          # =====================================================
          # ROBUST GOOGLE DRIVE DOWNLOAD
          # =====================================================

          def download_drive_file(
              file_id,
              output_file,
              max_retries=5
          ):

              for attempt in range(
                  1,
                  max_retries + 1
              ):

                  try:

                      print()
                      print(
                          "================================"
                      )

                      print(
                          "Downloading: "
                          + output_file.name
                      )

                      print(
                          f"Attempt: "
                          f"{attempt}/{max_retries}"
                      )

                      print(
                          "================================"
                      )

                      # -----------------------------------------
                      # Remove incomplete file
                      # -----------------------------------------

                      if output_file.exists():

                          try:
                              output_file.unlink()
                          except:
                              pass

                      # -----------------------------------------
                      # Request
                      # -----------------------------------------

                      request = (
                          drive_service
                          .files()
                          .get_media(
                              fileId=file_id
                          )
                      )

                      # -----------------------------------------
                      # Download
                      # -----------------------------------------

                      with open(
                          output_file,
                          "wb"
                      ) as fh:

                          downloader = (
                              MediaIoBaseDownload(
                                  fh,
                                  request,
                                  chunksize=10 * 1024 * 1024
                              )
                          )

                          done = False

                          while not done:

                              status, done = (
                                  downloader.next_chunk(
                                      num_retries=3
                                  )
                              )

                              if status:

                                  progress = int(
                                      status.progress()
                                      * 100
                                  )

                                  print(
                                      "Download progress: "
                                      f"{progress}%"
                                  )

                      # -----------------------------------------
                      # Verify
                      # -----------------------------------------

                      if (
                          output_file.exists()
                          and output_file.stat().st_size > 0
                      ):

                          size_mb = (
                              output_file.stat().st_size
                              / 1024
                              / 1024
                          )

                          print(
                              "Download completed: "
                              f"{size_mb:.2f} MB"
                          )

                          return True

                      raise RuntimeError(
                          "Downloaded file is empty."
                      )

                  except Exception as e:

                      print()
                      print(
                          "DOWNLOAD ERROR:"
                      )

                      print(
                          str(e)
                      )

                      if output_file.exists():

                          try:
                              output_file.unlink()
                          except:
                              pass

                      if attempt < max_retries:

                          wait_seconds = (
                              attempt * 10
                          )

                          print(
                              "Retrying in "
                              f"{wait_seconds} seconds..."
                          )

                          time.sleep(
                              wait_seconds
                          )

                      else:

                          print(
                              "Maximum download retries reached."
                          )

                          return False

              return False


          # =====================================================
          # START
          # =====================================================

          print()
          print(
              "======================================"
          )

          print(
              "GOOGLE DRIVE MEDIA SCANNER"
          )

          print(
              "======================================"
          )


          # =====================================================
          # DRIVE FILES
          # =====================================================

          print()
          print(
              "Scanning Google Drive..."
          )

          drive_files = list_drive_children(
              VIDEO_FOLDER_ID
          )

          video_files = []

          for file in drive_files:

              filename = file.get(
                  "name",
                  ""
              )

              extension = Path(
                  filename
              ).suffix.lower()

              if extension in VIDEO_EXTENSIONS:

                  video_files.append(
                      file
                  )

          print(
              f"Video files found: "
              f"{len(video_files)}"
          )


          # =====================================================
          # COVER FILES
          # =====================================================

          cover_folder_id = (
              find_cover_folder()
          )

          cover_files = []

          if cover_folder_id:

              print(
                  "Cover folder found: "
                  + cover_folder_id
              )

              cover_files = (
                  list_drive_children(
                      cover_folder_id
                  )
              )

          else:

              print(
                  "Cover folder পাওয়া যায়নি."
              )


          # =====================================================
          # RESULT ARRAYS
          # =====================================================

          media_rows = []

          file_rows = []

          video_rows = []

          audio_rows = []

          subtitle_rows = []

          cover_rows = []

          media_json = []


          # =====================================================
          # TEMP DIRECTORY
          # =====================================================

          temp_dir = Path(
              "temp_media"
          )

          temp_dir.mkdir(
              parents=True,
              exist_ok=True
          )


          # =====================================================
          # PROCESS EVERY VIDEO
          # =====================================================

          for file_number, file in enumerate(
              video_files,
              start=1
          ):

              file_id = file["id"]

              filename = file.get(
                  "name",
                  ""
              )

              print()
              print()
              print(
                  "########################################"
              )

              print(
                  f"FILE {file_number}/"
                  f"{len(video_files)}"
              )

              print(
                  filename
              )

              print(
                  "########################################"
              )


              media_id = generate_media_id(
                  file_id
              )

              drive_url = drive_view_url(
                  file_id
              )

              download_url = drive_download_url(
                  file_id
              )

              local_file = (
                  temp_dir
                  / filename
              )


              # =================================================
              # DOWNLOAD
              # =================================================

              download_success = (
                  download_drive_file(
                      file_id,
                      local_file,
                      max_retries=5
                  )
              )


              if not download_success:

                  print(
                      "WARNING: Download failed:"
                  )

                  print(
                      filename
                  )

                  print(
                      "Skipping this file."
                  )

                  continue


              # =================================================
              # FFPROBE
              # =================================================

              try:

                  probe = ffprobe_file(
                      local_file
                  )

              except Exception as e:

                  print(
                      "FFPROBE ERROR:"
                  )

                  print(
                      str(e)
                  )

                  print(
                      "Skipping this file."
                  )

                  continue


              # =================================================
              # METADATA
              # =================================================

              metadata = get_metadata(
                  probe,
                  filename
              )

              title = metadata["title"]

              artist = metadata["artist"]

              album = metadata["album"]

              composer = metadata["composer"]

              genre = metadata["genre"]

              language = metadata["language"]


              print(
                  "Title: "
                  + title
              )

              print(
                  "Artist: "
                  + (
                      artist
                      if artist
                      else "[Not found]"
                  )
              )

              print(
                  "Album: "
                  + (
                      album
                      if album
                      else "[Not found]"
                  )
              )

              print(
                  "Composer: "
                  + (
                      composer
                      if composer
                      else "[Not found]"
                  )
              )

              print(
                  "Genre: "
                  + (
                      genre
                      if genre
                      else "[Not found]"
                  )
              )

              print(
                  "Language: "
                  + (
                      language
                      if language
                      else "[Not found]"
                  )
              )


              # =================================================
              # VIDEO
              # =================================================

              current_video_rows = (
                  scan_video_streams(
                      probe,
                      media_id,
                      filename
                  )
              )

              video_rows.extend(
                  current_video_rows
              )


              # =================================================
              # AUDIO
              # =================================================

              current_audio_rows = (
                  scan_audio_streams(
                      probe,
                      media_id
                  )
              )

              audio_rows.extend(
                  current_audio_rows
              )


              # =================================================
              # SUBTITLE
              # =================================================

              current_subtitle_rows = (
                  scan_subtitle_streams(
                      probe,
                      media_id
                  )
              )

              subtitle_rows.extend(
                  current_subtitle_rows
              )


              # =================================================
              # VIDEO SUMMARY
              # =================================================

              if current_video_rows:

                  main_video = (
                      current_video_rows[0]
                  )

                  width = main_video["Width"]

                  height = main_video["Height"]

                  resolution = (
                      main_video["Resolution"]
                  )

                  codec = (
                      main_video["Codec"]
                  )

                  quality = video_quality(
                      width,
                      height
                  )

              else:

                  resolution = ""
                  codec = ""
                  quality = ""


              # =================================================
              # AUDIO SUMMARY
              # =================================================

              audio_count = len(
                  current_audio_rows
              )

              hi_res_count = sum(

                  1

                  for audio
                  in current_audio_rows

                  if audio["Hi_Res"] == "Yes"

              )


              # =================================================
              # COVER
              # =================================================

              cover_source = ""

              cover_value = ""


              custom_cover = (
                  find_custom_cover(
                      title,
                      filename,
                      cover_files
                  )
              )


              if custom_cover:

                  cover_source = "Custom"

                  cover_filename = (
                      custom_cover.get(
                          "name",
                          ""
                      )
                  )

                  cover_value = (
                      "covers/"
                      + cover_filename
                  )

                  cover_drive_url = (
                      drive_view_url(
                          custom_cover["id"]
                      )
                  )

                  cover_rows.append({

                      "Cover_ID":
                          f"{media_id}-C1",

                      "Media_ID":
                          media_id,

                      "File_Name":
                          cover_filename,

                      "Cover_Source":
                          "Custom",

                      "Cover_URL":
                          cover_value,

                      "Drive_URL":
                          cover_drive_url
                  })


              else:

                  embedded_cover = (
                      extract_embedded_cover(
                          local_file,
                          media_id
                      )
                  )


                  if embedded_cover:

                      cover_source = "Embedded"

                      cover_value = (
                          embedded_cover
                      )

                      cover_rows.append({

                          "Cover_ID":
                              f"{media_id}-C1",

                          "Media_ID":
                              media_id,

                          "File_Name":
                              Path(
                                  embedded_cover
                              ).name,

                          "Cover_Source":
                              "Embedded",

                          "Cover_URL":
                              embedded_cover,

                          "Drive_URL":
                              ""
                      })


                  else:

                      fallback_cover = (
                          create_fallback_cover(
                              title,
                              media_id
                          )
                      )

                      cover_source = "Generated"

                      cover_value = (
                          fallback_cover
                      )

                      cover_rows.append({

                          "Cover_ID":
                              f"{media_id}-C1",

                          "Media_ID":
                              media_id,

                          "File_Name":
                              Path(
                                  fallback_cover
                              ).name,

                          "Cover_Source":
                              "Generated",

                          "Cover_URL":
                              fallback_cover,

                          "Drive_URL":
                              ""
                      })


              # =================================================
              # MEDIA ROW
              # =================================================

              media_rows.append([

                  media_id,

                  title,

                  filename,

                  artist,

                  album,

                  composer,

                  genre,

                  language,

                  resolution,

                  codec,

                  quality,

                  audio_count,

                  hi_res_count,

                  len(
                      current_subtitle_rows
                  ),

                  cover_value,

                  cover_source,

                  drive_url,

                  download_url

              ])


              # =================================================
              # FILE ROW
              # =================================================

              file_rows.append([

                  file_id,

                  media_id,

                  filename,

                  Path(
                      filename
                  ).suffix.lower().replace(
                      ".",
                      ""
                  ),

                  file_size_text(
                      file.get("size")
                  ),

                  file.get(
                      "modifiedTime",
                      ""
                  ),

                  drive_url,

                  download_url

              ])


              # =================================================
              # MEDIA JSON
              # =================================================

              media_json.append({

                  "Media_ID":
                      media_id,

                  "Title":
                      title,

                  "File_Name":
                      filename,

                  "Artist":
                      artist,

                  "Album":
                      album,

                  "Composer":
                      composer,

                  "Genre":
                      genre,

                  "Language":
                      language,

                  "Resolution":
                      resolution,

                  "Video_Codec":
                      codec,

                  "Video_Quality":
                      quality,

                  "Audio_Count":
                      audio_count,

                  "Hi_Res_Audio":
                      hi_res_count,

                  "Subtitle_Count":
                      len(
                          current_subtitle_rows
                      ),

                  "Cover":
                      cover_value,

                  "Cover_Source":
                      cover_source,

                  "Drive_URL":
                      drive_url,

                  "Download_URL":
                      download_url,

                  "Video":
                      current_video_rows,

                  "Audio":
                      current_audio_rows,

                  "Subtitle":
                      current_subtitle_rows

              })


              print(
                  "Completed: "
                  + filename
              )


          # =====================================================
          # WRITE MEDIA.JSON
          # =====================================================

          with open(
              "media.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  media_json,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "media.json তৈরি হয়েছে."
          )


          # =====================================================
          # ENSURE SHEET
          # =====================================================

          def ensure_sheet(sheet_name):

              spreadsheet = (
                  sheets_service
                  .spreadsheets()
                  .get(
                      spreadsheetId=SPREADSHEET_ID
                  )
                  .execute()
              )

              existing_sheets = [

                  s["properties"]["title"]

                  for s in spreadsheet.get(
                      "sheets",
                      []
                  )

              ]

              if sheet_name in existing_sheets:

                  return


              body = {

                  "requests": [

                      {

                          "addSheet": {

                              "properties": {

                                  "title":
                                      sheet_name

                              }

                          }

                      }

                  ]

              }


              (
                  sheets_service
                  .spreadsheets()
                  .batchUpdate(
                      spreadsheetId=SPREADSHEET_ID,
                      body=body
                  )
                  .execute()
              )


          # =====================================================
          # WRITE SHEET
          # =====================================================

          def write_sheet(
              sheet_name,
              headers,
              rows
          ):

              ensure_sheet(
                  sheet_name
              )


              # -------------------------------------------------
              # CLEAR OLD DATA
              # -------------------------------------------------

              (
                  sheets_service
                  .spreadsheets()
                  .values()
                  .clear(
                      spreadsheetId=SPREADSHEET_ID,
                      range=f"{sheet_name}!A:ZZ",
                      body={}
                  )
                  .execute()
              )


              # -------------------------------------------------
              # IMPORTANT FIX
              #
              # Dictionary → List
              #
              # Google Sheets API receives rows according
              # to the exact header order.
              # -------------------------------------------------

              prepared_rows = []


              for row in rows:

                  if isinstance(
                      row,
                      dict
                  ):

                      prepared_row = [

                          row.get(
                              header,
                              ""
                          )

                          for header in headers

                      ]

                      prepared_rows.append(
                          prepared_row
                      )

                  else:

                      prepared_rows.append(
                          row
                      )


              # -------------------------------------------------
              # FINAL VALUES
              # -------------------------------------------------

              values = [
                  headers
              ]

              values.extend(
                  prepared_rows
              )


              # -------------------------------------------------
              # WRITE
              # -------------------------------------------------

              (
                  sheets_service
                  .spreadsheets()
                  .values()
                  .update(

                      spreadsheetId=
                          SPREADSHEET_ID,

                      range=
                          f"{sheet_name}!A1",

                      valueInputOption=
                          "RAW",

                      body={
                          "values":
                              values
                      }

                  )
                  .execute()
              )


              print(
                  f"{sheet_name}: "
                  f"{len(prepared_rows)} rows written."
              )


          # =====================================================
          # WRITE ALL SHEETS
          # =====================================================

          write_sheet(
              "Media",
              SHEET_HEADERS["Media"],
              media_rows
          )


          write_sheet(
              "Files",
              SHEET_HEADERS["Files"],
              file_rows
          )


          write_sheet(
              "Video",
              SHEET_HEADERS["Video"],
              video_rows
          )


          write_sheet(
              "Audio",
              SHEET_HEADERS["Audio"],
              audio_rows
          )


          write_sheet(
              "Subtitle",
              SHEET_HEADERS["Subtitle"],
              subtitle_rows
          )


          write_sheet(
              "Covers",
              SHEET_HEADERS["Covers"],
              cover_rows
          )


          # =====================================================
          # CLEAN TEMP
          # =====================================================

          if temp_dir.exists():

              shutil.rmtree(
                  temp_dir
              )


          # =====================================================
          # FINAL REPORT
          # =====================================================

          print()
          print(
              "======================================"
          )

          print(
              "SCAN COMPLETED SUCCESSFULLY"
          )

          print(
              "======================================"
          )

          print(
              f"Media    : {len(media_rows)}"
          )

          print(
              f"Files    : {len(file_rows)}"
          )

          print(
              f"Video    : {len(video_rows)}"
          )

          print(
              f"Audio    : {len(audio_rows)}"
          )

          print(
              f"Subtitle : {len(subtitle_rows)}"
          )

          print(
              f"Covers   : {len(cover_rows)}"
          )

          print(
              "======================================"
          )


