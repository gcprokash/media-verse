name: Hi-Res Audio Scanner

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # প্রতি ৩০ মিনিট পর পর রান হবে (মিনিট সেভ রাখতে)
    - cron: "*/30 * * * *"

concurrency:
  group: hires-audio-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # সর্বোচ্চ ১০ মিনিটের নিরাপদ টাইমআউট

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # INSTALL PYTHON PACKAGES
      # =========================================================
      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2


      # =========================================================
      # CREATE HI-RES AUDIO SCANNER
      # =========================================================
      - name: Create Hi-Res Audio Scanner
        run: |
          cat > hires_audio_scanner.py <<'PYTHON'

          import os
          import re
          import json
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build


          # =====================================================
          # CONFIGURATION
          # =====================================================

          AUDIO_FOLDER_ID = "16gtAwWywOlJrSwQ0HZOJcDegcVXfiX2K"
          SPREADSHEET_ID = "1hPw7hJFHmUuLjaRVK6VBU8n98W1ebuTWLuNSMOCTDcQ"
          SHEET_NAME = "HiResAudio"

          AUDIO_EXTENSIONS = {
              ".flac",
              ".wav",
              ".alac",
              ".m4a"
          }


          # =====================================================
          # SERVICE ACCOUNT
          # =====================================================

          SERVICE_ACCOUNT_JSON = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON"
          )

          if not SERVICE_ACCOUNT_JSON:
              raise RuntimeError(
                  "GOOGLE_SERVICE_ACCOUNT_JSON secret পাওয়া যায়নি।"
              )


          # =====================================================
          # GOOGLE AUTHENTICATION
          # =====================================================

          SCOPES = [
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/spreadsheets"
          ]

          credentials = (
              service_account
              .Credentials
              .from_service_account_info(
                  json.loads(SERVICE_ACCOUNT_JSON),
                  scopes=SCOPES
              )
          )

          drive_service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          sheets_service = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          # =====================================================
          # STRING HELPERS
          # =====================================================

          def safe_string(value):
              if value is None:
                  return ""
              return str(value).strip()


          def get_title(filename):
              filename = safe_string(filename)
              suffix = Path(filename).suffix
              if suffix:
                  return filename[:-len(suffix)].strip()
              return filename


          def normalize_title(value):
              value = safe_string(value).casefold()
              value = re.sub(r"\s+", " ", value)
              return value.strip()


          # =====================================================
          # DRIVE URLS
          # =====================================================

          def drive_view_url(file_id):
              return f"https://drive.google.com/file/d/{file_id}/view"


          def drive_download_url(file_id):
              return f"https://drive.google.com/uc?export=download&id={file_id}"


          # =====================================================
          # LIST AUDIO FILES
          # =====================================================

          def list_audio_files():
              audio_files = []
              page_token = None

              while True:
                  request_args = {
                      "q": f"'{AUDIO_FOLDER_ID}' in parents and trashed = false",
                      "fields": "nextPageToken, files(id, name, mimeType, modifiedTime)",
                      "pageSize": 1000
                  }

                  if page_token:
                      request_args["pageToken"] = page_token

                  response = drive_service.files().list(**request_args).execute()
                  files = response.get("files", [])

                  for file in files:
                      filename = safe_string(file.get("name"))
                      extension = Path(filename).suffix.lower()
                      if extension in AUDIO_EXTENSIONS:
                          audio_files.append(file)

                  page_token = response.get("nextPageToken")
                  if not page_token:
                      break

              return audio_files


          # =====================================================
          # ENSURE SHEET EXISTS
          # =====================================================

          def ensure_sheet():
              spreadsheet = sheets_service.spreadsheets().get(
                  spreadsheetId=SPREADSHEET_ID
              ).execute()

              existing_sheets = {
                  sheet["properties"]["title"]
                  for sheet in spreadsheet.get("sheets", [])
              }

              if SHEET_NAME in existing_sheets:
                  return

              print("Creating sheet: " + SHEET_NAME)
              body = {
                  "requests": [{
                      "addSheet": {
                          "properties": {
                              "title": SHEET_NAME
                          }
                      }
                  }]
              }

              sheets_service.spreadsheets().batchUpdate(
                  spreadsheetId=SPREADSHEET_ID,
                  body=body
              ).execute()


          # =====================================================
          # WRITE HI-RES AUDIO SHEET
          # =====================================================

          def write_sheet(rows):
              ensure_sheet()
              headers = [
                  "Title",
                  "File_Name",
                  "Format",
                  "Drive_URL",
                  "Download_URL"
              ]

              values = [headers]
              values.extend(rows)

              # CLEAR ONLY HiResAudio
              sheets_service.spreadsheets().values().clear(
                  spreadsheetId=SPREADSHEET_ID,
                  range=f"{SHEET_NAME}!A:ZZ",
                  body={}
              ).execute()

              # WRITE DATA
              sheets_service.spreadsheets().values().update(
                  spreadsheetId=SPREADSHEET_ID,
                  range=f"{SHEET_NAME}!A1",
                  valueInputOption="RAW",
                  body={"values": values}
              ).execute()


          # =====================================================
          # MAIN
          # =====================================================

          def main():
              print("\n======================================")
              print("HI-RES AUDIO SCANNER")
              print("======================================\n")
              print(f"Audio Folder ID: {AUDIO_FOLDER_ID}")
              print(f"Spreadsheet ID : {SPREADSHEET_ID}")
              print(f"Sheet Name     : {SHEET_NAME}\n")
              print("Scanning Google Drive...")

              audio_files = list_audio_files()
              print(f"Hi-Res audio files found: {len(audio_files)}")

              rows = []
              used_titles = set()

              for file in audio_files:
                  file_id = safe_string(file.get("id"))
                  filename = safe_string(file.get("name"))

                  if not file_id or not filename:
                      continue

                  title = get_title(filename)
                  if not title:
                      continue

                  normalized_title = normalize_title(title)
                  if normalized_title in used_titles:
                      print(f"Duplicate title skipped: {title}")
                      continue

                  used_titles.add(normalized_title)

                  extension = Path(filename).suffix.lower().lstrip(".")
                  audio_format = extension.upper()

                  view_url = drive_view_url(file_id)
                  download_url = drive_download_url(file_id)

                  rows.append([
                      title,
                      filename,
                      audio_format,
                      view_url,
                      download_url
                  ])

                  print(f"Found: {title} [{audio_format}]")

              rows.sort(key=lambda row: normalize_title(row[0]))

              print("\nWriting HiResAudio sheet...")
              write_sheet(rows)

              print("\n======================================")
              print("SCAN COMPLETED SUCCESSFULLY")
              print("======================================")
              print(f"Files written: {len(rows)}")
              print(f"Sheet        : {SHEET_NAME}")
              print("======================================\n")


          if __name__ == "__main__":
              main()

          PYTHON


      # =========================================================
      # CHECK PYTHON SYNTAX
      # =========================================================
      - name: Check Python Syntax
        run: |
          python -m py_compile hires_audio_scanner.py


      # =========================================================
      # RUN SCANNER
      # =========================================================
      - name: Run Hi-Res Audio Scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python hires_audio_scanner.py
