name: Hi-Res Audio Scanner

permissions:
  contents: read

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:

  scan:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # =========================================================
      # INSTALL PYTHON PACKAGES
      # =========================================================

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2


      # =========================================================
      # CREATE HI-RES AUDIO SCANNER
      # =========================================================

      - name: Create Hi-Res Audio Scanner
        run: |

          cat > hires_audio_scanner.py <<'PYTHON'

          import os
          import re
          import json
          from pathlib import Path

          from google.oauth2 import service_account
          from googleapiclient.discovery import build


          # =====================================================
          # CONFIGURATION
          # =====================================================

          AUDIO_FOLDER_ID = "16gtAwWywOlJrSwQ0HZOJcDegcVXfiX2K"

          SPREADSHEET_ID = "1hPw7hJFHmUuLjaRVK6VBU8n98W1ebuTWLuNSMOCTDcQ"

          SHEET_NAME = "HiResAudio"

          AUDIO_EXTENSIONS = {
              ".flac",
              ".wav",
              ".alac",
              ".m4a"
          }


          # =====================================================
          # SERVICE ACCOUNT
          # =====================================================

          SERVICE_ACCOUNT_JSON = os.environ.get(
              "GOOGLE_SERVICE_ACCOUNT_JSON"
          )

          if not SERVICE_ACCOUNT_JSON:
              raise RuntimeError(
                  "GOOGLE_SERVICE_ACCOUNT_JSON secret পাওয়া যায়নি।"
              )


          # =====================================================
          # GOOGLE AUTHENTICATION
          # =====================================================

          SCOPES = [
              "https://www.googleapis.com/auth/drive.readonly",
              "https://www.googleapis.com/auth/spreadsheets"
          ]

          credentials = service_account.Credentials.from_service_account_info(
              json.loads(SERVICE_ACCOUNT_JSON),
              scopes=SCOPES
          )

          drive_service = build(
              "drive",
              "v3",
              credentials=credentials
          )

          sheets_service = build(
              "sheets",
              "v4",
              credentials=credentials
          )


          # =====================================================
          # HELPERS
          # =====================================================

          def safe_string(value):

              if value is None:
                  return ""

              return str(value).strip()


          def get_title(filename):

              """
              Remove only the final file extension.

              Example:
              VARDAAT.flac -> VARDAAT
              """

              filename = safe_string(
                  filename
              )

              suffix = Path(filename).suffix

              if suffix:

                  return filename[
                      :-len(suffix)
                  ].strip()

              return filename


          def normalize_title(value):

              value = safe_string(
                  value
              ).casefold()

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def drive_view_url(file_id):

              return (
                  "https://drive.google.com/file/d/"
                  + file_id
                  + "/view"
              )


          def drive_download_url(file_id):

              return (
                  "https://drive.google.com/uc?"
                  "export=download&id="
                  + file_id
              )


          # =====================================================
          # LIST FILES FROM AUDIO FOLDER
          # =====================================================

          def list_audio_files():

              audio_files = []

              page_token = None

              while True:

                  response = (
                      drive_service
                      .files()
                      .list(
                          q=(
                              f"'{AUDIO_FOLDER_ID}' "
                              "in parents "
                              "and trashed = false"
                          ),
                          fields=(
                              "nextPageToken,"
                              "files("
                              "id,"
                              "name,"
                              "mimeType,"
                              "modifiedTime"
                              ")"
                          ),
                          pageSize=1000,
                          pageToken=page_token
                      )
                      .execute()
                  )

                  for file in response.get(
                      "files",
                      []
                  ):

                      filename = safe_string(
                          file.get("name")
                      )

                      extension = (
                          Path(filename)
                          .suffix
                          .lower()
                      )

                      if extension in AUDIO_EXTENSIONS:

                          audio_files.append(
                              file
                          )

                  page_token = response.get(
                      "nextPageToken"
                  )

                  if not page_token:
                      break

              return audio_files


          # =====================================================
          # ENSURE SHEET EXISTS
          # =====================================================

          def ensure_sheet():

              spreadsheet = (
                  sheets_service
                  .spreadsheets()
                  .get(
                      spreadsheetId=SPREADSHEET_ID
                  )
                  .execute()
              )

              existing_sheets = {
                  sheet["properties"]["title"]
                  for sheet in spreadsheet.get(
                      "sheets",
                      []
                  )
              }

              if SHEET_NAME in existing_sheets:
                  return

              print(
                  f"Creating sheet: {SHEET_NAME}"
              )

              body = {
                  "requests": [
                      {
                          "addSheet": {
                              "properties": {
                                  "title": SHEET_NAME
                              }
                          }
                      }
                  ]
              }

              (
                  sheets_service
                  .spreadsheets()
                  .batchUpdate(
                      spreadsheetId=SPREADSHEET_ID,
                      body=body
                  )
                  .execute()
              )


          # =====================================================
          # WRITE HI-RES AUDIO SHEET
          # =====================================================

          def write_sheet(rows):

              ensure_sheet()

              headers = [
                  "Title",
                  "File_Name",
                  "Format",
                  "Drive_URL",
                  "Download_URL"
              ]

              values = [
                  headers
              ]

              values.extend(
                  rows
              )

              # -------------------------------------------------
              # CLEAR ONLY HiResAudio TAB
              #
              # Main Media Sheet এবং Covers TAB untouched.
              # -------------------------------------------------

              (
                  sheets_service
                  .spreadsheets()
                  .values()
                  .clear(
                      spreadsheetId=SPREADSHEET_ID,
                      range=f"{SHEET_NAME}!A:ZZ",
                      body={}
                  )
                  .execute()
              )

              # -------------------------------------------------
              # WRITE NEW DATA
              # -------------------------------------------------

              (
                  sheets_service
                  .spreadsheets()
                  .values()
                  .update(
                      spreadsheetId=SPREADSHEET_ID,
                      range=f"{SHEET_NAME}!A1",
                      valueInputOption="RAW",
                      body={
                          "values": values
                      }
                  )
                  .execute()
              )


          # =====================================================
          # START
          # =====================================================

          print()

          print(
              "======================================"
          )

          print(
              "HI-RES AUDIO SCANNER"
          )

          print(
              "======================================"
          )

          print()

          print(
              "Audio folder:"
          )

          print(
              AUDIO_FOLDER_ID
          )

          print()

          print(
              "Scanning Google Drive..."
          )

          audio_files = (
              list_audio_files()
          )

          print(
              "Hi-Res audio files found: "
              + str(len(audio_files))
          )


          # =====================================================
          # BUILD SHEET ROWS
          # =====================================================

          rows = []

          used_titles = set()

          for file in audio_files:

              file_id = safe_string(
                  file.get("id")
              )

              filename = safe_string(
                  file.get("name")
              )

              if not file_id:
                  continue

              if not filename:
                  continue

              title = get_title(
                  filename
              )

              if not title:
                  continue

              normalized_title = (
                  normalize_title(
                      title
                  )
              )

              # -------------------------------------------------
              # DUPLICATE TITLE
              # -------------------------------------------------

              if normalized_title in used_titles:

                  print(
                      "Duplicate title skipped: "
                      + title
                  )

                  continue

              used_titles.add(
                  normalized_title
              )

              extension = (
                  Path(filename)
                  .suffix
                  .lower()
                  .lstrip(".")
              )

              audio_format = (
                  extension.upper()
              )

              row = [
                  title,
                  filename,
                  audio_format,
                  drive_view_url(
                      file_id
                  ),
                  drive_download_url(
                      file_id
                  )
              ]

              rows.append(
                  row
              )

              print(
                  "Found: "
                  + title
                  + " ["
                  + audio_format
                  + "]"
              )


          # =====================================================
          # SORT BY TITLE
          # =====================================================

          rows.sort(
              key=lambda row:
                  normalize_title(
                      row[0]
                  )
          )


          # =====================================================
          # WRITE SHEET
          # =====================================================

          write_sheet(
              rows
          )


          # =====================================================
          # FINAL REPORT
          # =====================================================

          print()

          print(
              "======================================"
          )

          print(
              "SCAN COMPLETED SUCCESSFULLY"
          )

          print(
              "======================================"
          )

          print(
              "Files written: "
              + str(len(rows))
          )

          print(
              "Sheet: "
              + SHEET_NAME
          )

          print(
              "======================================"


          PYTHON


      # =========================================================
      # RUN HI-RES AUDIO SCANNER
      # =========================================================

      - name: Run Hi-Res Audio Scanner
        env:

          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

        run: |

          python hires_audio_scanner.py
